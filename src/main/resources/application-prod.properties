# PostgreSQL Database Configuration (Production Environment)
spring.datasource.url=jdbc:postgresql://localhost:5432/homeimprovementtracker_prod?currentSchema=homeimprovementtracker
spring.datasource.username=hituser
spring.datasource.password=hituser
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Actuator Configuration (limited exposure for production)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=true
management.health.defaults.enabled=true

# Swagger UI disabled for production
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
