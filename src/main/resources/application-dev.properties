# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/homeimprovementtracker
spring.datasource.username=hitadmin
spring.datasource.password=hitadmin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
