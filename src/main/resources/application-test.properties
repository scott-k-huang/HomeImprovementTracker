# PostgreSQL Database Configuration (Test Environment)
spring.datasource.url=jdbc:postgresql://localhost:5432/homeimprovementtracker_test?currentSchema=homeimprovementtracker
spring.datasource.username=hituser
spring.datasource.password=hituser
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.defaults.enabled=true

# Swagger UI enabled for test profile
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
